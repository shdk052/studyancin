<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocab Master</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet" />

    <style>
        body {
            font-family: "Assistant", sans-serif;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100">
<div id="root"></div>

<script type="text/babel">

const { useState, useEffect, useRef } = React;

const Icon = ({ name, size = 24 }) => (
    <i data-lucide={name} style={{ width: size, height: size }}></i>
);

const vocabulary = [
    { en: "adapt", he: "להסתגל / להתאים" },
    { en: "afraid", he: "מפחד" },
    { en: "allow", he: "להרשות / לאפשר" },
    { en: "announce", he: "להודיע / להכריז" },
    { en: "control", he: "לשלוט / שליטה" },
    { en: "damage", he: "נזק / להזיק" },
    { en: "drum", he: "תוף / לתופף" },
    { en: "escape", he: "לברוח / בריחה" },
    { en: "height", he: "גובה" },
    { en: "joy", he: "שמחה / אושר" },
    { en: "strategy", he: "אסטרטגיה" },
    { en: "wonder", he: "לתהות / פלא" },
    { en: "worried", he: "מודאג" }
];

function App() {
    const [tab, setTab] = useState("quiz");

    useEffect(() => {
        lucide.createIcons();
    });

    return (
        <div className="p-6">
            <button onClick={() => setTab("quiz")} className="bg-cyan-600 px-4 py-2 rounded-xl mr-2">
                מבחן
            </button>
            <button onClick={() => setTab("dict")} className="bg-slate-700 px-4 py-2 rounded-xl">
                מילון
            </button>

            {tab === "quiz" && <Quiz data={vocabulary} />}
            {tab === "dict" && <Dictionary data={vocabulary} />}
        </div>
    );
}

function Dictionary({ data }) {
    return (
        <div className="grid md:grid-cols-2 gap-4 mt-6">
            {data.map((v, i) => (
                <div key={i} className="bg-slate-800 p-4 rounded-xl">
                    <div className="text-cyan-400 text-xl font-bold">{v.en}</div>
                    <div>{v.he}</div>
                </div>
            ))}
        </div>
    );
}

function Quiz({ data }) {
    const [idx, setIdx] = useState(0);
    const [answers, setAnswers] = useState({});
    const [finished, setFinished] = useState(false);
    const [options, setOptions] = useState([]);

    const timeoutRef = useRef(null);

    // 🔥 DEBUG API לקונסול
    useEffect(() => {
        window.__quiz = {
            setIdx,
            setFinished,
            data,
            finish: () => setFinished(true),
            skipToEnd: () => {
                setIdx(data.length);
                setFinished(true);
            }
        };

        return () => delete window.__quiz;
    }, [data]);

    useEffect(() => {
        if (idx >= data.length) return;

        const correct = data[idx];
        const wrong = [...data]
            .filter(x => x.en !== correct.en)
            .sort(() => Math.random() - 0.5)
            .slice(0, 3);

        setOptions([correct, ...wrong].sort(() => Math.random() - 0.5));

    }, [idx]);

    const handleAnswer = (opt) => {
        if (answers[idx]) return;

        const isCorrect = opt.en === data[idx].en;

        setAnswers(prev => ({
            ...prev,
            [idx]: { isCorrect }
        }));

        timeoutRef.current = setTimeout(() => {
            if (idx + 1 < data.length) {
                setIdx(i => i + 1);
            } else {
                setFinished(true);
            }
        }, 800);
    };

    const reset = () => {
        clearTimeout(timeoutRef.current);
        setIdx(0);
        setAnswers({});
        setFinished(false);
    };

    if (finished) {
        const score = Object.values(answers).filter(a => a.isCorrect).length;

        return (
            <div className="text-center mt-10">
                <h1 className="text-3xl font-bold mb-4">סיימת!</h1>
                <p className="text-2xl text-cyan-400">{Math.round(score / data.length * 100)}%</p>
                <button onClick={reset} className="mt-6 bg-cyan-600 px-6 py-3 rounded-xl">
                    נסה שוב
                </button>
            </div>
        );
    }

    return (
        <div className="mt-10">
            <h2 className="text-2xl mb-4">
                שאלה {idx + 1} / {data.length}
            </h2>

            <div className="text-4xl font-bold mb-6 text-cyan-400">
                {data[idx].en}
            </div>

            <div className="grid gap-3">
                {options.map((o, i) => (
                    <button
                        key={i}
                        onClick={() => handleAnswer(o)}
                        className="bg-slate-800 p-4 rounded-xl"
                    >
                        {o.he}
                    </button>
                ))}
            </div>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
