<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Master</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body { font-family: 'Assistant', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 dark:bg-slate-900 dark:text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        // Lucide replaces <i> tags with <svg> elements behind React's back, which makes
        // React crash (blank screen) when it later removes/replaces them.
        // So React only renders an empty wrapper, and the icon is injected inside it manually.
        const Icon = ({ name, size = 24, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (!ref.current) return;
                ref.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px;height:${size}px"></i>`;
                lucide.createIcons();
            }, [name, size, className]);
            return <span ref={ref} style={{ display: 'contents' }}></span>;
        };

        const vocabulary = [
            { "en": "adopt", "he": "לאמץ" },
            { "en": "afterwards", "he": "אחר כך" },
            { "en": "angel", "he": "מלאך" },
            { "en": "announce", "he": "להכריז" },
            { "en": "announcement", "he": "הודעה, הכרזה" },
            { "en": "appreciate", "he": "להעריך" },
            { "en": "aspect", "he": "היבט" },
            { "en": "borrow", "he": "לקחת בהשאלה" },
            { "en": "cage", "he": "כלוב" },
            { "en": "colleague", "he": "חבר לעבודה" },
            { "en": "convenient", "he": "נוח" },
            { "en": "custom", "he": "מנהג" },
            { "en": "demonstrate", "he": "להדגים, להפגין" },
            { "en": "ensure", "he": "לוודא, להבטיח" },
            { "en": "equal (adj)", "he": "שווה" },
            { "en": "forgive", "he": "לסלוח" },
            { "en": "go viral", "he": "להפוך לויראלי" },
            { "en": "hardly", "he": "בקושי" },
            { "en": "headache", "he": "כאב ראש" },
            { "en": "mean (adj)", "he": "רשע, לא נחמד" },
            { "en": "nowadays", "he": "בימינו" },
            { "en": "odd", "he": "מוזר" },
            { "en": "original (adj)", "he": "מקורי" },
            { "en": "photography", "he": "צילום" },
            { "en": "post (v)", "he": "לפרסם" },
            { "en": "previous", "he": "הקודם" },
            { "en": "result in", "he": "לגרום ל..., להוביל ל..." },
            { "en": "selfie", "he": "סלפי (תמונה עצמית)" },
            { "en": "sense of humor", "he": "חוש הומור" },
            { "en": "technique", "he": "טכניקה" },
            { "en": "though", "he": "למרות" },
            { "en": "to be honest", "he": "למען האמת" }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('dictionary');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(true);

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                    document.body.className = "bg-slate-900 text-slate-100";
                } else {
                    document.documentElement.classList.remove('dark');
                    document.body.className = "bg-slate-50 text-slate-900";
                }
            }, [isDarkMode]);

            return (
                <div className="min-h-screen flex flex-col transition-colors duration-300">
                    <header className="bg-white dark:bg-slate-950 border-b border-slate-200 dark:border-cyan-900 sticky top-0 z-50 shadow-lg transition-colors duration-300">
                        <div className="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
                            <button 
                                onClick={() => setIsDarkMode(!isDarkMode)}
                                className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-cyan-400 hover:scale-110 transition-all shadow-sm border border-slate-200 dark:border-slate-700"
                                title={isDarkMode ? "מעבר למצב בהיר" : "מעבר למצב כהה"}
                            >
                                <Icon name={isDarkMode ? "sun" : "moon"} size={20} />
                            </button>

                            <div className="flex items-center gap-3">
                                <Icon name="sparkles" className="text-cyan-600 dark:text-cyan-400" size={24} />
                                <a href="https://shdk052.github.io/studyancin/" className="text-2xl font-black text-slate-900 dark:text-white tracking-tighter uppercase">VOCAB MASTER</a>
                            </div>

                            <button className="md:hidden text-cyan-600 dark:text-cyan-400" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                <Icon name={isMenuOpen ? "x" : "menu"} />
                            </button>
                        </div>
                        <nav className="hidden md:flex justify-center gap-4 pb-4">
                            <TabBtn active={activeTab === 'dictionary'} onClick={() => setActiveTab('dictionary')} label="מילון" icon="book" />
                            <TabBtn active={activeTab === 'flashcards'} onClick={() => setActiveTab('flashcards')} label="כרטיסיות" icon="layers" />
                            <TabBtn active={activeTab === 'quiz'} onClick={() => setActiveTab('quiz')} label="מבחן" icon="check-circle" />
                            <TabBtn active={activeTab === 'sentences'} onClick={() => setActiveTab('sentences')} label="השלמת משפטים" icon="pencil" />
                        </nav>
                        {isMenuOpen && (
                            <div className="md:hidden bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-cyan-900 p-4 flex flex-col gap-2 transition-colors duration-300">
                                <button onClick={() => {setActiveTab('dictionary'); setIsMenuOpen(false)}} className="p-3 text-right text-slate-600 dark:text-slate-300 border-b border-slate-100 dark:border-slate-800">מילון</button>
                                <button onClick={() => {setActiveTab('flashcards'); setIsMenuOpen(false)}} className="p-3 text-right text-slate-600 dark:text-slate-300 border-b border-slate-100 dark:border-slate-800">כרטיסיות</button>
                                <button onClick={() => {setActiveTab('quiz'); setIsMenuOpen(false)}} className="p-3 text-right text-slate-600 dark:text-slate-300 border-b border-slate-100 dark:border-slate-800">מבחן</button>
                                <button onClick={() => {setActiveTab('sentences'); setIsMenuOpen(false)}} className="p-3 text-right text-slate-600 dark:text-slate-300">השלמת משפטים</button>
                            </div>
                        )}
                    </header>

                    <main className="max-w-4xl mx-auto p-4 md:p-8 flex-grow w-full">
                        {activeTab === 'dictionary' && <Dictionary data={vocabulary} />}
                        {activeTab === 'flashcards' && <Flashcards data={vocabulary} />}
                        {activeTab === 'quiz' && <Quiz data={vocabulary} />}
                        {activeTab === 'sentences' && <SentenceQuiz data={vocabulary} />}
                    </main>
                </div>
            );
        }

        const TabBtn = ({ active, onClick, label, icon }) => (
            <button onClick={onClick} className={`flex items-center gap-2 px-6 py-2 rounded-full font-bold transition-all ${active ? 'bg-cyan-600 text-white shadow-lg' : 'text-slate-500 dark:text-slate-400 hover:text-cyan-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                <Icon name={icon} size={18} /> {label}
            </button>
        );

        const Dictionary = ({ data }) => (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {data.map((item, i) => (
                    <div key={i} className="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 hover:border-cyan-500 dark:hover:border-cyan-500 transition-all group shadow-sm hover:shadow-md">
                        <div className="text-cyan-600 dark:text-cyan-400 font-black text-xl group-hover:scale-105 transition-transform">{item.en}</div>
                        <div className="text-slate-600 dark:text-slate-400 mt-2 font-medium">{item.he}</div>
                    </div>
                ))}
            </div>
        );

        const Flashcards = ({ data }) => {
            const [idx, setIdx] = useState(0);
            const [flipped, setFlipped] = useState(false);
            const current = data[idx];

            const next = () => { setFlipped(false); setIdx((idx + 1) % data.length); };
            const prev = () => { setFlipped(false); setIdx((idx - 1 + data.length) % data.length); };

            return (
                <div className="flex flex-col items-center justify-center py-10">
                    <div className="perspective-1000 w-full max-w-sm h-80 cursor-pointer" onClick={() => setFlipped(!flipped)}>
                        <div className={`relative w-full h-full duration-700 transform-style-3d transition-transform ${flipped ? 'rotate-y-180' : ''}`}>
                            <div className="absolute inset-0 backface-hidden bg-white dark:bg-slate-800 rounded-3xl border-2 border-slate-200 dark:border-slate-700 flex flex-col items-center justify-center shadow-2xl">
                                <div className="text-5xl font-black text-slate-900 dark:text-white">{current.en}</div>
                                <div className="mt-8 text-cyan-600 dark:text-cyan-500 text-xs font-bold uppercase tracking-widest animate-pulse">לחץ להפיכה</div>
                            </div>
                            <div className="absolute inset-0 backface-hidden rotate-y-180 bg-cyan-600 dark:bg-cyan-700 rounded-3xl flex items-center justify-center shadow-2xl border-2 border-cyan-500">
                                <div className="text-3xl font-bold text-white text-center px-6 leading-tight">{current.he}</div>
                            </div>
                        </div>
                    </div>
                    <div className="flex gap-8 mt-12 items-center">
                        <button onClick={prev} className="p-5 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-white hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-600 transition-all active:scale-90 shadow-md"><Icon name="arrow-right"/></button>
                        <div className="text-xl font-bold text-slate-400 dark:text-slate-500">{idx + 1} / {data.length}</div>
                        <button onClick={next} className="p-5 rounded-full bg-cyan-600 text-white hover:bg-cyan-500 transition-all shadow-lg active:scale-90"><Icon name="arrow-left"/></button>
                    </div>
                </div>
            );
        };

        const Quiz = ({ data }) => {
            const [idx, setIdx] = useState(0);
            const [answers, setAnswers] = useState({});
            const [finished, setFinished] = useState(false);
            const [currentOptions, setCurrentOptions] = useState([]);

            useEffect(() => {
                if (idx < data.length) {
                    const correct = data[idx];
                    const wrong = [...data].filter(x => x.en !== correct.en).sort(() => 0.5 - Math.random()).slice(0, 3);
                    setCurrentOptions([correct, ...wrong].sort(() => 0.5 - Math.random()));
                }
            }, [idx, data]);

            const handleAnswer = (option) => {
                if (answers[idx]) return;
                
                const isCorrect = option.en === data[idx].en;
                setAnswers({
                    ...answers,
                    [idx]: {
                        selected: option,
                        correct: data[idx],
                        isCorrect
                    }
                });

                setTimeout(() => {
                    if (idx + 1 < data.length) {
                        setIdx(idx + 1);
                    } else {
                        setFinished(true);
                    }
                }, 1000);
            };

            const reset = () => {
                setIdx(0);
                setAnswers({});
                setFinished(false);
            };

            useEffect(() => {
                window.skipQuiz = () => setFinished(true);
                window.resetQuiz = reset;
                window.answerQuiz = () => handleAnswer(data[idx]);
                window.goToQuizQuestion = (questionNumber) => {
                    const nextIdx = Number(questionNumber) - 1;
                    if (!Number.isInteger(nextIdx) || nextIdx < 0 || nextIdx >= data.length) {
                        console.warn(`בחרו שאלה בין 1 ל-${data.length}.`);
                        return;
                    }
                    setIdx(nextIdx);
                    setFinished(false);
                };
                window.revealQuizAnswer = () => {
                    const current = data[idx];
                    console.log(`${current.en} = ${current.he}`);
                    return current;
                };

                return () => {
                    delete window.skipQuiz;
                    delete window.resetQuiz;
                    delete window.answerQuiz;
                    delete window.goToQuizQuestion;
                    delete window.revealQuizAnswer;
                };
            }, [idx, data, answers]);

            if (finished) {
                const score = Object.values(answers).filter(a => a.isCorrect).length;
                return (
                    <div className="text-center py-12 bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 p-8">
                        <Icon name="trophy" className="mx-auto text-yellow-500 mb-6" size={64} />
                        <h2 className="text-4xl font-black text-slate-900 dark:text-white mb-2">המבחן הסתיים!</h2>
                        <div className="text-6xl font-black text-cyan-600 dark:text-cyan-400 my-8">{Math.round((score / data.length) * 100)}%</div>
                        <p className="text-xl text-slate-600 dark:text-slate-400 mb-8">ענית נכון על {score} מתוך {data.length} מילים.</p>
                        <button onClick={reset} className="px-10 py-4 bg-cyan-600 text-white rounded-2xl font-black text-xl hover:bg-cyan-500 transition-all shadow-lg">נסה שוב</button>
                    </div>
                );
            }

            const current = data[idx];
            const answer = answers[idx];

            return (
                <div className="max-w-2xl mx-auto">
                    <div className="mb-8 flex justify-between items-end">
                        <div>
                            <div className="text-slate-400 dark:text-slate-500 font-bold mb-1">שאלה {idx + 1} מתוך {data.length}</div>
                            <h2 className="text-3xl font-black text-slate-900 dark:text-white">מה התרגום של:</h2>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-slate-800 p-12 rounded-3xl border-2 border-slate-200 dark:border-slate-700 shadow-xl mb-8 text-center">
                        <div className="text-5xl font-black text-cyan-600 dark:text-cyan-400">{current.en}</div>
                    </div>

                    <div className="grid grid-cols-1 gap-4">
                        {currentOptions.map((opt, i) => {
                            let statusClasses = "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:border-cyan-500";
                            if (answer) {
                                if (opt.en === current.en) statusClasses = "bg-green-100 dark:bg-green-900/30 border-green-500 text-green-700 dark:text-green-400";
                                else if (answer.selected.en === opt.en) statusClasses = "bg-red-100 dark:bg-red-900/30 border-red-500 text-red-700 dark:text-red-400";
                                else statusClasses = "opacity-50 bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700";
                            }

                            return (
                                <button 
                                    key={i} 
                                    onClick={() => handleAnswer(opt)}
                                    className={`p-5 rounded-2xl border-2 font-bold text-xl transition-all text-right flex justify-between items-center ${statusClasses}`}
                                >
                                    <span>{opt.he}</span>
                                    {answer && opt.en === current.en && <Icon name="check" size={20} />}
                                    {answer && answer.selected.en === opt.en && opt.en !== current.en && <Icon name="x" size={20} />}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ---------- Sentence completion ----------
        const sentenceBank = {
            "adopt": "After years of volunteering at the shelter, they finally decided to ___ a rescue dog.",
            "afterwards": "We watched the film together, and ___ we discussed its ending over dinner.",
            "angel": "The sculptor carved a delicate stone ___ with outstretched wings for the garden.",
            "announce": "The company will ___ its new CEO at tomorrow's press conference.",
            "announcement": "The principal's unexpected ___ about the schedule change surprised everyone in the hall.",
            "appreciate": "I really ___ your help with the project; I couldn't have finished it without you.",
            "aspect": "Cost is only one ___ of the decision; we must also consider the environmental impact.",
            "borrow": "Could I ___ your charger for an hour? Mine just died and I have an urgent call.",
            "cage": "The parrot escaped and flew around the room after someone left the door of its ___ open.",
            "colleague": "My ___ covered my shift so that I could attend my brother's wedding.",
            "convenient": "Living close to the train station is extremely ___ for people who commute to the city.",
            "custom": "In many countries, it is a long-standing ___ to remove your shoes before entering a home.",
            "demonstrate": "The physics teacher used a simple experiment to ___ how magnets attract metal objects.",
            "ensure": "Please double-check the figures to ___ that there are no errors in the final report.",
            "equal (adj)": "In a fair society, everyone should have ___ opportunities, regardless of their background.",
            "forgive": "It took her a very long time to ___ him for breaking such an important promise.",
            "go viral": "The comedian's short clip managed to ___ within hours of being uploaded, reaching millions of viewers.",
            "hardly": "It was so noisy in the cafeteria that I could ___ hear what she was saying.",
            "headache": "Staring at a bright screen for ten hours straight gave me a terrible ___.",
            "mean (adj)": "It was really ___ of him to laugh at her mistake in front of the whole class.",
            "nowadays": "Most people use their phones to pay for groceries ___, rather than carrying cash.",
            "odd": "It's rather ___ that he hasn't called yet; he is usually extremely punctual.",
            "original (adj)": "The museum proudly displays the ___ manuscript, not a copy, behind thick protective glass.",
            "photography": "She studied ___ at university and now runs a successful business shooting weddings.",
            "post (v)": "She decided to ___ the photos from her trip on her blog so her friends could see them.",
            "previous": "Unlike my ___ job, this one allows me to work from home three days a week.",
            "result in": "Ignoring basic safety checks can ___ serious accidents and costly repairs.",
            "selfie": "He held out his arm to take a ___ with the famous actor before she left the restaurant.",
            "sense of humor": "What I admire most about her is her great ___; she can make anyone laugh, even on a bad day.",
            "technique": "The chef taught us a special ___ for folding the dough so it stays light and airy.",
            "though": "The hike was exhausting; the view from the top was breathtaking, ___.",
            "to be honest": "I didn't enjoy the film as much as I expected, ___."
        };

        const cleanWord = (w) => w.replace(/\s*\(.*?\)\s*/g, '').trim();
        const ROUND_SIZE = 10;
        const shuffleArr = (arr) => [...arr].sort(() => 0.5 - Math.random());

        const buildRound = (data) =>
            shuffleArr(data.filter(v => sentenceBank[v.en])).slice(0, ROUND_SIZE).map(item => {
                const wrong = shuffleArr(data.filter(v => v.en !== item.en)).slice(0, 3);
                return { item, sentence: sentenceBank[item.en], options: shuffleArr([item, ...wrong]) };
            });

        const SentenceQuiz = ({ data }) => {
            const [round, setRound] = useState(() => buildRound(data));
            const [idx, setIdx] = useState(0);
            const [selected, setSelected] = useState(null);
            const [score, setScore] = useState(0);
            const [finished, setFinished] = useState(false);

            const q = round[idx];

            const handlePick = (opt) => {
                if (selected) return;
                setSelected(opt);
                if (opt.en === q.item.en) setScore(s => s + 1);
            };

            const next = () => {
                if (idx + 1 < round.length) {
                    setIdx(idx + 1);
                    setSelected(null);
                } else {
                    setFinished(true);
                }
            };

            const restart = () => {
                setRound(buildRound(data));
                setIdx(0);
                setSelected(null);
                setScore(0);
                setFinished(false);
            };

            if (finished) {
                return (
                    <div className="text-center py-12 bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 p-8">
                        <Icon name="trophy" className="mx-auto text-yellow-500 mb-6" size={64} />
                        <h2 className="text-4xl font-black text-slate-900 dark:text-white mb-2">הסבב הסתיים!</h2>
                        <div className="text-6xl font-black text-cyan-600 dark:text-cyan-400 my-8">{Math.round((score / round.length) * 100)}%</div>
                        <p className="text-xl text-slate-600 dark:text-slate-400 mb-8">השלמת נכון {score} מתוך {round.length} משפטים.</p>
                        <button onClick={restart} className="px-10 py-4 bg-cyan-600 text-white rounded-2xl font-black text-xl hover:bg-cyan-500 transition-all shadow-lg">סבב חדש</button>
                    </div>
                );
            }

            const isCorrect = selected && selected.en === q.item.en;
            const [before, after] = q.sentence.split('___');

            return (
                <div className="max-w-2xl mx-auto">
                    <div className="mb-6">
                        <div className="flex justify-between items-center text-slate-400 dark:text-slate-500 font-bold mb-2">
                            <span>משפט {idx + 1} מתוך {round.length}</span>
                            <span>ניקוד: {score}</span>
                        </div>
                        <div className="h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                            <div className="h-full bg-cyan-600 transition-all duration-300" style={{ width: `${(idx / round.length) * 100}%` }}></div>
                        </div>
                        <h2 className="text-3xl font-black text-slate-900 dark:text-white mt-4">השלם את המשפט:</h2>
                    </div>

                    <div dir="ltr" className="bg-white dark:bg-slate-800 p-8 md:p-10 rounded-3xl border-2 border-slate-200 dark:border-slate-700 shadow-xl mb-6 text-left text-2xl md:text-3xl font-bold leading-relaxed text-slate-800 dark:text-slate-100">
                        {before}
                        <span className={`inline-block min-w-[6rem] text-center px-2 mx-1 border-b-4 ${
                            !selected ? 'border-cyan-500 text-transparent'
                            : isCorrect ? 'border-green-500 text-green-600 dark:text-green-400'
                            : 'border-red-500 text-red-600 dark:text-red-400'
                        }`}>
                            {selected ? cleanWord(selected.en) : '_____'}
                        </span>
                        {after}
                    </div>

                    <div dir="ltr" className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        {q.options.map((opt) => {
                            let cls = "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:border-cyan-500";
                            if (selected) {
                                if (opt.en === q.item.en) cls = "bg-green-100 dark:bg-green-900/30 border-green-500 text-green-700 dark:text-green-400";
                                else if (selected.en === opt.en) cls = "bg-red-100 dark:bg-red-900/30 border-red-500 text-red-700 dark:text-red-400";
                                else cls = "opacity-50 bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200";
                            }
                            return (
                                <button
                                    key={opt.en}
                                    onClick={() => handlePick(opt)}
                                    className={`p-5 rounded-2xl border-2 font-bold text-xl transition-all text-center ${cls}`}
                                >
                                    {cleanWord(opt.en)}
                                </button>
                            );
                        })}
                    </div>

                    {selected && (
                        <div className="mt-6">
                            <div className={`p-4 rounded-2xl font-bold text-lg text-center ${isCorrect ? 'bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400' : 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400'}`}>
                                {isCorrect ? 'נכון! ' : 'לא נכון. התשובה הנכונה: '}
                                <span dir="ltr" className="font-black">{cleanWord(q.item.en)}</span> — {q.item.he}
                            </div>
                            <button onClick={next} className="mt-4 w-full px-8 py-4 bg-cyan-600 text-white rounded-2xl font-black text-xl hover:bg-cyan-500 transition-all shadow-lg">
                                {idx + 1 < round.length ? 'למשפט הבא' : 'סיום וסיכום'}
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
